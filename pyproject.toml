[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "envoy"
version = "0.2.1"
description = "the bulletin bulletin MCP: membership, published status, mail notes, syos notes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Scott Mackey" }]
dependencies = [
    "fastmcp>=2.0.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
envoy = "envoy.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/envoy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --tb=short"
pythonpath = [".", "src"]
